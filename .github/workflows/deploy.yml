#
name: Build Test Analyze Backup Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pre-install global tools
        run: |
          npm install -g rimraf@2 webpack@2.5.0
          echo "$(npm bin -g)" >> $GITHUB_PATH

      - name: Build with Maven
        run: mvn clean compile

      - name: Test
        run: mvn test

      - name: Run full verification build
        run: mvn -B verify

      - name: Package production WAR
        run: mvn clean package -P production -DskipTests

      - name: Upload the built WAR archive
        uses: actions/upload-artifact@v4
        with:
          name: production-war
          path: target/*.war
          retention-days: 30

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: harunch/java:latest
